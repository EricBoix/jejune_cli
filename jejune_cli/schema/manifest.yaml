# Schema for manifest.yaml files in jejune_doc_* repositories.
required_fields:
  title: string
  authors: list
  year: integer
  keywords: list
  slug: string
optional_fields:
  isbn: string
  graph_extractions: sequence
# All file paths values are repo-relative paths
file_fields:
  # Source document (when starting from a pdf)
  - pdf_file
  # Source document (might be converted out of a pdf source)
  - markdown_file

required_file_fields:  # must be present and point to an existing file
  - markdown_file
# Per-entry schema for items in the graph_extractions sequence.
# chunk_file is optional when the turtle was generated from multiple chunk files.
graph_extractions_entry_required_fields:
  - model_name
  - chunk_short_name
  - turtle_file
graph_extractions_entry_optional_fields:
  - chunk_file
  - graph_setups
graph_extractions_entry_file_fields:
  - turtle_file
  - chunk_file
# Per-item schema for the optional graph_setups sequence nested in a graph_extractions entry.
# A graph setup is a viewer scene (displayed nodes, pins, ...) saved as a YAML file beside the turtle file.
graph_setups_item_required_fields:
  - name
  - setup_file
graph_setups_item_optional_fields:
  - description
graph_setups_item_file_fields:
  - setup_file
