[project]
name = "jejune-cli"
version = "0.1.0"
description = "jejuneness workflow CLI — configure, build and deploy knowledge graphs"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "rdflib>=6.0",
    "tomli>=1.1.0 ; python_version < '3.11'",
]

[project.scripts]
jejune = "jejune_cli.click.main:cli"

[tool.jejune]
ecosystem-repo-base = "https://github.com/EricBoix"

[build-system]
requires = ["hatchling", "tomli ; python_version < '3.11'"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
]

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["jejune_cli"]


# black is deliberately NOT a dev-dependency: the IDE (VS Code Black Formatter
# extension) and the shell must use the same black version, otherwise the two
# reformat each other's output. Run the extension's bundled copy:
#   PYTHONPATH=~/.vscode/extensions/ms-python.black-formatter-*/bundled/libs \
#     uv run python -m black <file>
# (the extension folder name carries a version: use the glob.)
# See Readme.md, section "Development > Formatting". No option is set: black's
# defaults (e.g. line length 88) apply.
[tool.black]

[tool.pytest.ini_options]
testpaths = ["tests"]
