[project]
name = "jejune-cli"
version = "0.1.0"
description = "jejuneness workflow CLI — configure, build and deploy knowledge graphs"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "jejune-catalog-check",
    "pyyaml>=6.0",
]

[project.scripts]
jejune = "jejune_cli.main:cli"

[tool.jejune]
ecosystem-repo-base = "https://github.com/EricBoix"

[build-system]
requires = ["hatchling", "tomli ; python_version < '3.11'"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["jejune_cli"]

[tool.uv.sources]
jejune-catalog-check = { path = "../jejune_catalog/check", editable = true }
